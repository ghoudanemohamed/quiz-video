# Déploiement gratuit sur Render. Les valeurs secrètes se saisissent dans le tableau de bord Render.
services:
  - type: web
    name: quiz-video
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
